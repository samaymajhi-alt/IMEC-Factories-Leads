<div id="root"></div>

<script type="text/babel" data-presets="react">
const { useState, useEffect, useMemo, useRef } = React;

firebase.initializeApp(FIREBASE_CONFIG);
const auth = firebase.auth();
const db = firebase.firestore();

const STATUS_OPTIONS = [
  { value: "New", color: "var(--status-new)" },
  { value: "Attempted", color: "var(--status-attempted)" },
  { value: "Contacted", color: "var(--status-contacted)" },
  { value: "Interested", color: "var(--status-interested)" },
  { value: "Not Interested", color: "var(--status-notinterested)" },
  { value: "Converted", color: "var(--status-converted)" },
];
const statusColor = (s) => (STATUS_OPTIONS.find(o => o.value === s) || STATUS_OPTIONS[0]).color;

const PRIORITY_OPTIONS = [
  { value: "High", color: "var(--priority-high)" },
  { value: "Medium", color: "var(--priority-medium)" },
  { value: "Low", color: "var(--priority-low)" },
];
const priorityColor = (p) => (PRIORITY_OPTIONS.find(o => o.value === p) || PRIORITY_OPTIONS[1]).color;

function isSameDay(a, b){
  return a.getFullYear()===b.getFullYear() && a.getMonth()===b.getMonth() && a.getDate()===b.getDate();
}

function shortDate(ts){
  if(!ts) return "—";
  const d = ts.toDate ? ts.toDate() : new Date(ts);
  if(isSameDay(d, new Date())) return "Today";
  return d.toLocaleDateString(undefined, { day: "numeric", month: "short" });
}

function dateInputValue(ts){
  if(!ts) return "";
  const d = ts.toDate ? ts.toDate() : new Date(ts);
  const off = d.getTimezoneOffset();
  return new Date(d.getTime() - off*60000).toISOString().slice(0,10);
}

function fullDate(ts){
  if(!ts) return "";
  const d = ts.toDate ? ts.toDate() : new Date(ts);
  return d.toLocaleDateString(undefined, { day: "2-digit", month: "short", year: "numeric" });
}

function timeAgo(ts){
  if(!ts) return "—";
  const d = ts.toDate ? ts.toDate() : new Date(ts);
  const diffMs = Date.now() - d.getTime();
  const mins = Math.floor(diffMs/60000);
  if(mins < 1) return "just now";
  if(mins < 60) return mins + "m ago";
  const hrs = Math.floor(mins/60);
  if(hrs < 24) return hrs + "h ago";
  const days = Math.floor(hrs/24);
  if(days < 30) return days + "d ago";
  return d.toLocaleDateString();
}

function LoginGate({ onSuccess }){
  const [pw, setPw] = useState("");
  const [err, setErr] = useState("");
  const [busy, setBusy] = useState(false);

  const submit = async (e) => {
    e.preventDefault();
    if(pw !== TEAM_PASSWORD){
      setErr("Incorrect password.");
      return;
    }
    setBusy(true);
    setErr("");
    try{
      await auth.signInAnonymously();
      sessionStorage.setItem("ledger_auth", "1");
      onSuccess();
    }catch(ex){
      setErr("Couldn't connect. Check your Firebase setup.");
    }
    setBusy(false);
  };

  return (
    <div className="login-wrap">
      <form className="login-card" onSubmit={submit}>
        <div className="login-mark"></div>
        <h1>IMEC Lead Tracker</h1>
        <p>Enter the team password to open the shared lead list.</p>
        <input
          type="password"
          placeholder="Team password"
          value={pw}
          onChange={e=>setPw(e.target.value)}
          autoFocus
        />
        <button type="submit" disabled={busy}>{busy ? "Opening…" : "Open ledger"}</button>
        {err && <div className="login-error">{err}</div>}
      </form>
    </div>
  );
}

function emptyLead(){
  return {
    company: "",
    address: "",
    contactPerson: "",
    phone: "",
    owner: "",
    status: "New",
    priority: "Medium",
    remarks: "",
    actionPoints: "",
  };
}

function AddLeadModal({ onClose, onSave }){
  const [form, setForm] = useState(emptyLead());
  const set = (k,v) => setForm(f => ({...f, [k]: v}));

  const submit = (e) => {
    e.preventDefault();
    if(!form.company.trim()) return;
    onSave(form);
  };

  return (
    <div className="modal-overlay" onClick={(e)=>{ if(e.target===e.currentTarget) onClose(); }}>
      <div className="modal-card">
        <h2>New lead</h2>
        <form onSubmit={submit}>
          <div className="modal-grid">
            <div className="full">
              <label>Customer / company name</label>
              <input value={form.company} onChange={e=>set("company", e.target.value)} autoFocus required />
            </div>
            <div className="full">
              <label>Address</label>
              <input value={form.address} onChange={e=>set("address", e.target.value)} />
            </div>
            <div>
              <label>Contact person</label>
              <input value={form.contactPerson} onChange={e=>set("contactPerson", e.target.value)} />
            </div>
            <div>
              <label>Phone</label>
              <input value={form.phone} onChange={e=>set("phone", e.target.value)} />
            </div>
            <div>
              <label>Owner</label>
              <input value={form.owner} onChange={e=>set("owner", e.target.value)} placeholder="Assigned to" />
            </div>
            <div>
              <label>Status</label>
              <select value={form.status} onChange={e=>set("status", e.target.value)}>
                {STATUS_OPTIONS.map(o => <option key={o.value} value={o.value}>{o.value}</option>)}
              </select>
            </div>
            <div>
              <label>Priority</label>
              <select value={form.priority} onChange={e=>set("priority", e.target.value)}>
                {PRIORITY_OPTIONS.map(o => <option key={o.value} value={o.value}>{o.value}</option>)}
              </select>
            </div>
            <div className="full">
              <label>Remarks</label>
              <textarea value={form.remarks} onChange={e=>set("remarks", e.target.value)} />
            </div>
            <div className="full">
              <label>Action points</label>
              <textarea value={form.actionPoints} onChange={e=>set("actionPoints", e.target.value)} placeholder="Next step, follow-up date, etc." />
            </div>
          </div>
          <div className="modal-actions">
            <button type="button" className="btn-ghost" onClick={onClose}>Cancel</button>
            <button type="submit" className="btn-primary">Add lead</button>
          </div>
        </form>
      </div>
    </div>
  );
}

function LeadRow({ lead, index, isOpen, onToggle }){
  const [draft, setDraft] = useState(lead);
  const [saving, setSaving] = useState(false);

  useEffect(() => { setDraft(lead); }, [lead, isOpen]);

  const set = (k,v) => setDraft(d => ({...d, [k]: v}));

  const save = async () => {
    setSaving(true);
    try{
      await db.collection("leads").doc(lead.id).update({
        company: draft.company,
        address: draft.address,
        contactPerson: draft.contactPerson,
        phone: draft.phone,
        owner: draft.owner,
        status: draft.status,
        priority: draft.priority,
        remarks: draft.remarks,
        actionPoints: draft.actionPoints,
        lastUpdated: firebase.firestore.FieldValue.serverTimestamp(),
      });
    }catch(ex){
      alert("Couldn't save changes: " + ex.message);
    }
    setSaving(false);
  };

  const remove = async () => {
    if(!confirm(`Remove "${lead.company}" from the ledger?`)) return;
    try{
      await db.collection("leads").doc(lead.id).delete();
    }catch(ex){
      alert("Couldn't delete: " + ex.message);
    }
  };

  return (
    <div className="lead-row">
      <div className="lead-row-main" onClick={onToggle}>
        <div className="row-index">{String(index+1).padStart(2,"0")}</div>
        <div className="row-company-cell">
          <div className="row-company">{lead.company || "Untitled"}</div>
          {lead.address && <div className="row-address">{lead.address}</div>}
        </div>
        <div className="row-contact">
          <div className="row-contact-name">{lead.contactPerson || "—"}</div>
          {lead.phone && <div className="row-phone">{lead.phone}</div>}
        </div>
        <div className="row-owner-cell row-owner">{lead.owner || "—"}</div>
        <div className="row-date-cell row-date">{shortDate(lead.createdAt)}</div>
        <div className="row-priority-cell">
          <span className="priority-pill"><span className="priority-dot" style={{background: priorityColor(lead.priority)}}></span>{lead.priority || "Medium"}</span>
        </div>
        <div className="row-status-cell">
          <span className="status-pill" style={{background: statusColor(lead.status)}}>{lead.status}</span>
        </div>
        <div className={"row-chevron" + (isOpen ? " open" : "")}>▸</div>
      </div>

      {isOpen && (
        <div className="lead-row-detail" onClick={e=>e.stopPropagation()}>
          <div className="detail-grid">
            <div>
              <div className="field-label">Customer / company name</div>
              <input value={draft.company} onChange={e=>set("company", e.target.value)} />
            </div>
            <div>
              <div className="field-label">Address</div>
              <input value={draft.address} onChange={e=>set("address", e.target.value)} />
            </div>
            <div>
              <div className="field-label">Contact person</div>
              <input value={draft.contactPerson} onChange={e=>set("contactPerson", e.target.value)} />
            </div>
            <div>
              <div className="field-label">Phone</div>
              <input value={draft.phone} onChange={e=>set("phone", e.target.value)} />
            </div>
            <div>
              <div className="field-label">Owner</div>
              <input value={draft.owner} onChange={e=>set("owner", e.target.value)} />
            </div>
            <div>
              <div className="field-label">Status</div>
              <select value={draft.status} onChange={e=>set("status", e.target.value)}>
                {STATUS_OPTIONS.map(o => <option key={o.value} value={o.value}>{o.value}</option>)}
              </select>
            </div>
            <div>
              <div className="field-label">Priority</div>
              <select value={draft.priority || "Medium"} onChange={e=>set("priority", e.target.value)}>
                {PRIORITY_OPTIONS.map(o => <option key={o.value} value={o.value}>{o.value}</option>)}
              </select>
            </div>
            <div className="detail-full">
              <div className="field-label">Remarks</div>
              <textarea value={draft.remarks} onChange={e=>set("remarks", e.target.value)} />
            </div>
            <div className="detail-full">
              <div className="field-label">Action points</div>
              <textarea value={draft.actionPoints} onChange={e=>set("actionPoints", e.target.value)} />
            </div>
          </div>
          <div className="detail-actions">
            <button className="btn-delete" onClick={remove}>Delete lead</button>
            <div className="detail-actions-right">
              <button className="btn-ghost" onClick={onToggle}>Close</button>
              <button className="btn-save" onClick={save} disabled={saving}>{saving ? "Saving…" : "Save changes"}</button>
            </div>
          </div>
          <div className="meta-line">Last updated {timeAgo(lead.lastUpdated)}</div>
        </div>
      )}
    </div>
  );
}

function Infographic({ stats }){
  const total = stats.total || 0;
  return (
    <div className="infographic">
      <div className="info-title">Lead pipeline snapshot</div>
      <div className="info-chips">
        <div className="info-chip"><span className="n">{stats.total}</span> total leads</div>
        <div className="info-chip"><span className="n">{stats.interested}</span> interested</div>
        <div className="info-chip"><span className="n">{stats.converted}</span> converted</div>
      </div>

      <div className="info-sub">Recent activity</div>
      <div className="info-chips">
        <div className="info-chip"><span className="n">{stats.today}</span> today</div>
        <div className="info-chip"><span className="n">{stats.yesterdayCount}</span> yesterday</div>
        <div className="info-chip"><span className="n">{stats.thisWeek}</span> this week</div>
      </div>

      <div className="info-sub">Status breakdown</div>
      {total > 0 ? (
        <div className="stacked-bar">
          {stats.byStatus.filter(s => s.count > 0).map(s => (
            <div key={s.value} className="seg" style={{width: (s.count/total*100)+"%", background: s.color}} title={s.value + ": " + s.count}></div>
          ))}
        </div>
      ) : <div className="stacked-bar"></div>}
      <div className="info-chips" style={{marginBottom:16}}>
        {stats.byStatus.map(s => (
          <div key={s.value} className="info-chip"><span className="dot" style={{background:s.color}}></span>{s.value} <span className="n">{s.count}</span></div>
        ))}
      </div>

      <div className="info-sub">Priority breakdown</div>
      <div className="priority-bars">
        {stats.byPriority.map(p => (
          <div key={p.value} className="priority-bar-row">
            <div className="priority-bar-label">{p.value}</div>
            <div className="priority-bar-track">
              <div className="priority-bar-fill" style={{width: (total ? (p.count/total*100) : 0)+"%", background: p.color}}></div>
            </div>
            <div className="priority-bar-count">{p.count}</div>
          </div>
        ))}
      </div>
    </div>
  );
}

function Dashboard(){
  const [leads, setLeads] = useState([]);
  const [loaded, setLoaded] = useState(false);
  const [online, setOnline] = useState(true);
  const [search, setSearch] = useState("");
  const [ownerFilter, setOwnerFilter] = useState("all");
  const [statusFilter, setStatusFilter] = useState("all");
  const [priorityFilter, setPriorityFilter] = useState("all");
  const [dateFrom, setDateFrom] = useState("");
  const [dateTo, setDateTo] = useState("");
  const [openId, setOpenId] = useState(null);
  const [showAdd, setShowAdd] = useState(false);

  useEffect(() => {
    const unsub = db.collection("leads").orderBy("lastUpdated", "desc")
      .onSnapshot(
        snap => {
          setLeads(snap.docs.map(d => ({ id: d.id, ...d.data() })));
          setLoaded(true);
          setOnline(true);
        },
        err => { setOnline(false); }
      );
    return unsub;
  }, []);

  const owners = useMemo(() => {
    const s = new Set(leads.map(l => l.owner).filter(Boolean));
    return Array.from(s).sort();
  }, [leads]);

  const filtered = useMemo(() => {
    const q = search.trim().toLowerCase();
    return leads.filter(l => {
      if(ownerFilter !== "all" && l.owner !== ownerFilter) return false;
      if(statusFilter !== "all" && l.status !== statusFilter) return false;
      if(priorityFilter !== "all" && (l.priority || "Medium") !== priorityFilter) return false;
      if(dateFrom || dateTo){
        const d = l.createdAt ? (l.createdAt.toDate ? l.createdAt.toDate() : new Date(l.createdAt)) : null;
        if(!d) return false;
        const dayStr = dateInputValue(d);
        if(dateFrom && dayStr < dateFrom) return false;
        if(dateTo && dayStr > dateTo) return false;
      }
      if(q){
        const hay = [l.company, l.contactPerson, l.phone, l.address].join(" ").toLowerCase();
        if(!hay.includes(q)) return false;
      }
      return true;
    });
  }, [leads, search, ownerFilter, statusFilter, priorityFilter, dateFrom, dateTo]);

  const stats = useMemo(() => {
    const total = leads.length;
    const interested = leads.filter(l => l.status === "Interested").length;
    const converted = leads.filter(l => l.status === "Converted").length;

    const now = new Date();
    const yesterday = new Date(now); yesterday.setDate(now.getDate() - 1);
    const weekStart = new Date(now);
    const dow = now.getDay(); // 0=Sun..6=Sat
    const diffToMonday = dow === 0 ? -6 : 1 - dow;
    weekStart.setDate(now.getDate() + diffToMonday);
    weekStart.setHours(0,0,0,0);

    const leadDate = (l) => {
      const ts = l.createdAt;
      if(!ts) return null;
      return ts.toDate ? ts.toDate() : new Date(ts);
    };

    const today = leads.filter(l => { const d = leadDate(l); return d && isSameDay(d, now); }).length;
    const yesterdayCount = leads.filter(l => { const d = leadDate(l); return d && isSameDay(d, yesterday); }).length;
    const thisWeek = leads.filter(l => { const d = leadDate(l); return d && d >= weekStart; }).length;

    const byStatus = STATUS_OPTIONS.map(o => ({
      ...o, count: leads.filter(l => l.status === o.value).length
    }));
    const byPriority = PRIORITY_OPTIONS.map(o => ({
      ...o, count: leads.filter(l => (l.priority || "Medium") === o.value).length
    }));
    return { total, interested, converted, today, yesterdayCount, thisWeek, byStatus, byPriority };
  }, [leads]);

  const addLead = async (form) => {
    try{
      await db.collection("leads").add({
        ...form,
        createdAt: firebase.firestore.FieldValue.serverTimestamp(),
        lastUpdated: firebase.firestore.FieldValue.serverTimestamp(),
      });
      setShowAdd(false);
    }catch(ex){
      alert("Couldn't add lead: " + ex.message);
    }
  };

  const exportExcel = () => {
    const rows = filtered.map((l, i) => ({
      "#": i + 1,
      "Customer": l.company || "",
      "Address": l.address || "",
      "Contact person": l.contactPerson || "",
      "Phone": l.phone || "",
      "Owner": l.owner || "",
      "Status": l.status || "",
      "Priority": l.priority || "Medium",
      "Date added": fullDate(l.createdAt),
      "Last updated": fullDate(l.lastUpdated),
      "Remarks": l.remarks || "",
      "Action points": l.actionPoints || "",
    }));

    const summaryRows = [
      { "Metric": "Total leads (in current view)", "Value": filtered.length },
      { "Metric": "Added today", "Value": stats.today },
      ...stats.byStatus.map(s => ({ "Metric": "Status: " + s.value, "Value": s.count })),
      ...stats.byPriority.map(p => ({ "Metric": "Priority: " + p.value, "Value": p.count })),
      { "Metric": "Exported on", "Value": fullDate(new Date()) },
    ];

    const wb = XLSX.utils.book_new();
    const leadsSheet = XLSX.utils.json_to_sheet(rows);
    leadsSheet["!cols"] = [
      {wch:4},{wch:26},{wch:26},{wch:18},{wch:15},{wch:14},{wch:12},{wch:10},
      {wch:12},{wch:14},{wch:34},{wch:34}
    ];
    const summarySheet = XLSX.utils.json_to_sheet(summaryRows);
    summarySheet["!cols"] = [{wch:28},{wch:12}];

    XLSX.utils.book_append_sheet(wb, summarySheet, "Summary");
    XLSX.utils.book_append_sheet(wb, leadsSheet, "Leads");

    const stamp = new Date().toISOString().slice(0,10);
    XLSX.writeFile(wb, `imec-lead-tracker-export-${stamp}.xlsx`);
  };

  return (
    <div className="app">
      <div className="app-header">
        <div>
          <h1>IMEC Lead Tracker</h1>
          <div className="subtitle">Shared cold-call lead list</div>
          <div className="conn-row">
            <span className={"conn-dot" + (online ? "" : " offline")}></span>
            {online ? "Synced live" : "Reconnecting…"}
          </div>
        </div>
        <div className="stats-row">
          <div className="stat"><div className="n">{stats.total}</div><div className="l">Leads</div></div>
          <div className="stat"><div className="n">{stats.interested}</div><div className="l">Interested</div></div>
          <div className="stat"><div className="n">{stats.converted}</div><div className="l">Converted</div></div>
        </div>
      </div>

      <Infographic stats={stats} />

      <div className="toolbar">
        <input
          type="text"
          placeholder="Search company, contact, phone, address…"
          value={search}
          onChange={e=>setSearch(e.target.value)}
        />
        <select value={ownerFilter} onChange={e=>setOwnerFilter(e.target.value)}>
          <option value="all">All owners</option>
          {owners.map(o => <option key={o} value={o}>{o}</option>)}
        </select>
        <select value={priorityFilter} onChange={e=>setPriorityFilter(e.target.value)}>
          <option value="all">All priorities</option>
          {PRIORITY_OPTIONS.map(o => <option key={o.value} value={o.value}>{o.value}</option>)}
        </select>
        <select value={statusFilter} onChange={e=>setStatusFilter(e.target.value)}>
          <option value="all">All statuses</option>
          {STATUS_OPTIONS.map(o => <option key={o.value} value={o.value}>{o.value}</option>)}
        </select>
        <input type="date" value={dateFrom} onChange={e=>setDateFrom(e.target.value)} title="From date" />
        <input type="date" value={dateTo} onChange={e=>setDateTo(e.target.value)} title="To date" />
        {(dateFrom || dateTo || priorityFilter!=="all" || statusFilter!=="all" || ownerFilter!=="all" || search) && (
          <button className="btn-ghost" onClick={()=>{setSearch("");setOwnerFilter("all");setStatusFilter("all");setPriorityFilter("all");setDateFrom("");setDateTo("");}}>Clear filters</button>
        )}
        <button className="btn-ghost" onClick={exportExcel}>Export to Excel</button>
        <button className="btn-primary" onClick={()=>setShowAdd(true)}>+ New lead</button>
      </div>

      <div className="ledger">
        <div className="ledger-head">
          <div>#</div>
          <div>Customer</div>
          <div>Contact</div>
          <div>Owner</div>
          <div>Date added</div>
          <div>Priority</div>
          <div>Status</div>
          <div></div>
        </div>

        {!loaded && <div className="empty-state">Loading ledger…</div>}

        {loaded && filtered.length === 0 && (
          <div className="empty-state">
            {leads.length === 0
              ? "No leads yet. Add your first one to start the ledger."
              : "No leads match your search or filters."}
          </div>
        )}

        {filtered.map((lead, i) => (
          <LeadRow
            key={lead.id}
            lead={lead}
            index={i}
            isOpen={openId === lead.id}
            onToggle={() => setOpenId(openId === lead.id ? null : lead.id)}
          />
        ))}
      </div>

      {showAdd && <AddLeadModal onClose={()=>setShowAdd(false)} onSave={addLead} />}
    </div>
  );
}

function App(){
  const [authed, setAuthed] = useState(sessionStorage.getItem("ledger_auth") === "1");
  return authed ? <Dashboard /> : <LoginGate onSuccess={()=>setAuthed(true)} />;
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
